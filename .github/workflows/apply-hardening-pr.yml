name: Apply hardening patch

on:
  pull_request:
    branches: [main]

authorization:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/runtime-hardening-2026-08-19' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/runtime-hardening-2026-08-19

      - name: Run exact hardening patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/one-shot-hardening.yml').read_text()
          marker = '        run: |\n'
          start = workflow.index(marker, workflow.index('name: Apply exact hardening replacements')) + len(marker)
          end = workflow.index('\n\n      - name: Commit hardened sources', start)
          body = workflow[start:end]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          script = '\n'.join(lines)
          exec(compile(script, '<hardening-patch>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Remove temporary workflows and commit
        run: |
          rm -f .github/workflows/one-shot-hardening.yml .github/workflows/apply-hardening-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden discovery telemetry TLS and view changes"
          git push origin HEAD:fix/runtime-hardening-2026-08-19

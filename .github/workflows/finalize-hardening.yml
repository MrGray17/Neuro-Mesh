name: Finalize hardening cleanup

on:
  push:
    branches: [fix/runtime-hardening-2026-08-19]
    paths: [.github/workflows/finalize-hardening.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/runtime-hardening-2026-08-19
          fetch-depth: 0

      - name: Fix build file and remove temporary CI job
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          makefile = Path("Makefile")
          text = makefile.read_text()
          old = "                      $(OBJ_DIR)/net/TransportLayer.o \\\n$(MESHNODE_TEST_TARGET):"
          new = "                      $(OBJ_DIR)/net/TransportLayer.o\n\n$(MESHNODE_TEST_TARGET):"
          if text.count(old) != 1:
              raise SystemExit(f"Makefile continuation pattern matched {text.count(old)} times")
          makefile.write_text(text.replace(old, new, 1))

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text()
          text, count = re.subn(
              r"\n  apply-source-hardening:\n.*?(?=\n  build:\n)",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"temporary CI job matched {count} times")
          ci.write_text(text)

          Path(".github/workflows/finalize-hardening.yml").unlink()
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore build graph after hardening cleanup"
          git fetch origin fix/runtime-hardening-2026-08-19
          git rebase origin/fix/runtime-hardening-2026-08-19
          git push origin HEAD:fix/runtime-hardening-2026-08-19

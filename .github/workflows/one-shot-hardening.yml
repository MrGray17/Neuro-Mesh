name: One-shot hardening patch

on:
  push:
    branches: [fix/runtime-hardening-2026-08-19]
    paths: [.github/workflows/one-shot-hardening.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/runtime-hardening-2026-08-19

      - name: Apply exact hardening replacements
        shell: python
        run: |
          from pathlib import Path
          import re

          def sub_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: pattern expected once, matched {count}: {pattern[:80]!r}")
              p.write_text(updated)

          # Cross-host discovery needs a shared epoch. steady_clock is host-local.
          sub_once(
              "consensus/MeshNode.cpp",
              r"(void MeshNode::send_discovery_beacon\(\) \{\n\s*using namespace std::chrono;\n\s*)auto now = steady_clock::now\(\);",
              r"\1// Discovery timestamps cross host boundaries, so use a shared wall-clock epoch.\n    auto now = system_clock::now();",
          )
          sub_once(
              "consensus/MeshNode.cpp",
              r"(// Anti-spoofing: check timestamp is within ±30s of now\n\s*using namespace std::chrono;\n\s*auto now_us = duration_cast<microseconds>\()steady_clock::now\(\)(\.time_since_epoch\(\)\)\.count\(\);)",
              r"// Freshness check uses wall-clock because the signed timestamp came from another host.\n    using namespace std::chrono;\n    auto now_us = duration_cast<microseconds>(system_clock::now().time_since_epoch()).count();",
          )

          # Only current V3 discovery binds the complete TLS identity into the signature.
          sub_once(
              "consensus/MeshNode.cpp",
              r"if \(tokens\[0\] != \"DISCOVERY\"\) return;\n\n\s*bool has_tls_fingerprint = tokens\.size\(\) >= 7;\n\s*bool has_signed_fpr = tokens\.size\(\) >= 8;\n\s*bool has_cert_pem\s*= tokens\.size\(\) >= 9;\n\s*if \(tokens\.size\(\) < 6\) return;",
              "if (tokens.size() != 9 || tokens[0] != \"DISCOVERY\") return;\n\n    const bool has_tls_fingerprint = true;\n    const bool has_signed_fpr = true;\n    const bool has_cert_pem = true;",
          )

          # Telemetry is security state: unsigned legacy packets must fail closed.
          sub_once(
              "consensus/MeshNode.cpp",
              r"    // Extract signature and json\n.*?(?=    m_peer_manager\.set_peer_telemetry\(peer_id, json\);)",
              '''    // Signed telemetry is mandatory. Legacy unsigned packets are rejected.\n    size_t third_delim = msg.find('|', second_delim + 1);\n    if (third_delim == std::string::npos) {\n        std::cerr << \"[TELEMETRY] Unsigned legacy telemetry rejected from \"\n                  << peer_id << std::endl;\n        return;\n    }\n\n    std::string b64_sig = msg.substr(second_delim + 1, third_delim - second_delim - 1);\n    std::string json = msg.substr(third_delim + 1);\n    if (b64_sig.empty() || json.empty()) return;\n\n    std::string peer_pem = m_peer_manager.get_peer_key(peer_id);\n    if (peer_pem.empty()) {\n        std::cerr << \"[TELEMETRY] Message from unregistered peer \" << peer_id\n                  << \" — rejected. Complete peer discovery first.\" << std::endl;\n        return;\n    }\n    auto pubkey = crypto::IdentityCore::get_pubkey_from_pem(peer_pem);\n    if (!pubkey) {\n        std::cerr << \"[TELEMETRY] Invalid registered key for \" << peer_id << std::endl;\n        return;\n    }\n    std::string unsigned_msg = \"TELEMETRY|\" + peer_id + \"|\" + json;\n    std::string raw_sig = base64_decode(b64_sig).value_or(\"\");\n    if (raw_sig.empty() ||\n        !crypto::IdentityCore::verify_signature(pubkey.get(), unsigned_msg, raw_sig)) {\n        std::cerr << \"[TELEMETRY] Signature verification FAILED for \" << peer_id << std::endl;\n        return;\n    }\n\n''',
              flags=re.S,
          )

          # Bind TLS transport identity to the authenticated certificate CN, never
          # to the client's ephemeral TCP source port.
          sub_once(
              "consensus/MeshNode.cpp",
              r"        if \(conn_info && conn_info->verified\) \{.*?(?=        if \(!matched\) \{)",
              '''        if (conn_info && conn_info->verified && !conn_info->subject_cn.empty()) {\n            auto peers = m_peer_manager.get_all_peers();\n            for (const auto& entry : peers) {\n                if (entry.node_id == conn_info->subject_cn && entry.ip == conn_info->peer_ip) {\n                    int old_fd = -1;\n                    if (m_peer_manager.get_peer_tls_fd(entry.node_id, old_fd) && old_fd >= 0) {\n                        m_transport->close(old_fd);\n                    }\n                    m_peer_manager.set_peer_tls_fd(entry.node_id, fd);\n                    std::cout << \"[TLS] Accepted authenticated connection from \"\n                              << entry.node_id << \" (\" << conn_info->peer_ip << \")\" << std::endl;\n                    matched = true;\n                    break;\n                }\n            }\n        }\n''',
              flags=re.S,
          )
          sub_once(
              "consensus/MeshNode.cpp",
              r"    int fd = m_transport->connect\(ip, static_cast<uint16_t>\(port\)\);\n    if \(fd < 0\) return false;\n\n    m_peer_manager\.set_peer_tls_fd\(peer_id, fd\);\n    return true;",
              '''    int fd = m_transport->connect(ip, static_cast<uint16_t>(port));\n    if (fd < 0) return false;\n\n    auto conn_info = m_transport->get_connection_info(fd);\n    if (!conn_info || !conn_info->verified || conn_info->subject_cn != peer_id) {\n        std::cerr << \"[TLS] Peer identity mismatch: expected \" << peer_id\n                  << \", certificate CN=\"\n                  << (conn_info ? conn_info->subject_cn : std::string(\"<missing>\"))\n                  << std::endl;\n        m_transport->close(fd);\n        return false;\n    }\n\n    m_peer_manager.set_peer_tls_fd(peer_id, fd);\n    return true;''',
          )

          # Tie view-change timeout to real active rounds instead of a synthetic key.
          sub_once(
              "consensus/PBFT.hpp",
              r"    \[\[nodiscard\]\] bool needs_view_change\(const std::string& evidence_json,.*?(?=\n    void set_round_commit_sig)",
              '''    [[nodiscard]] bool needs_view_change(const std::string& evidence_json,\n                                          const std::string& target_id) const {\n        std::lock_guard<std::mutex> lock(m_mtx);\n        const auto now = std::chrono::steady_clock::now();\n        const auto stalled = [&](const ConsensusRound& round) {\n            if (round.state == PBFTStage::IDLE || round.state == PBFTStage::EXECUTED) return false;\n            const auto elapsed = std::chrono::duration_cast<std::chrono::seconds>(\n                now - round.last_activity).count();\n            return elapsed > VIEW_CHANGE_TIMEOUT_SEC;\n        };\n\n        std::string round_key = crypto::IdentityCore::sha256_hex(\n            evidence_json + \"|\" + target_id);\n        if (round_key.empty()) round_key = evidence_json + \"|\" + target_id;\n        auto it = m_rounds.find(round_key);\n        if (it != m_rounds.end()) return stalled(it->second);\n\n        for (const auto& [key, round] : m_rounds) {\n            (void)key;\n            if (stalled(round)) return true;\n        }\n        return false;\n    }\n''',
              flags=re.S,
          )
          sub_once(
              "consensus/PBFT.hpp",
              r"    void advance_view\(\) \{\n\s*std::lock_guard<std::mutex> lock\(m_mtx\);\n\s*\+\+m_current_view;\n\s*std::cout << \"\[PBFT\] View advanced to \" << m_current_view << std::endl;\n\s*\}",
              '''    void advance_view() {\n        std::lock_guard<std::mutex> lock(m_mtx);\n        ++m_current_view;\n        const auto now = std::chrono::steady_clock::now();\n        for (auto& [key, round] : m_rounds) {\n            (void)key;\n            if (round.state != PBFTStage::EXECUTED) {\n                round.view = m_current_view;\n                round.last_activity = now;\n            }\n        }\n        std::cout << \"[PBFT] View advanced to \" << m_current_view << std::endl;\n    }''',
          )

          # Red-team simulator is tooling, not privileged runtime code.
          sub_once("Makefile", r"^\s*attacks/AttackSimulator\.cpp \\\n", "", flags=re.M)
          sub_once("Makefile", r"^\s*\$\(OBJ_DIR\)/attacks/AttackSimulator\.o\s*\\?\n", "", flags=re.M)

          Path(".github/workflows/one-shot-hardening.yml").unlink()

      - name: Commit hardened sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consensus/MeshNode.cpp consensus/PBFT.hpp Makefile .github/workflows/one-shot-hardening.yml
          git commit -m "fix: harden discovery telemetry TLS and view changes"
          git push origin HEAD:fix/runtime-hardening-2026-08-19

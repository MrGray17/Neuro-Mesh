name: Apply final source correctness fixes

on:
  push:
    branches: [fix/runtime-hardening-2026-08-19]
    paths: [.github/workflows/one-shot-hardening.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/runtime-hardening-2026-08-19
          fetch-depth: 0

      - name: Apply exact source fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          def sub_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: pattern expected once, matched {count}: {pattern[:80]!r}")
              p.write_text(updated)

          replace_once(
              "Makefile",
              "                      $(OBJ_DIR)/net/TransportLayer.o \\\n$(MESHNODE_TEST_TARGET):",
              "                      $(OBJ_DIR)/net/TransportLayer.o\n\n$(MESHNODE_TEST_TARGET):",
          )

          replace_once(
              "crypto/ProofChain.hpp",
              "std::chrono::steady_clock::now().time_since_epoch()",
              "std::chrono::system_clock::now().time_since_epoch()",
          )
          replace_once(
              "crypto/ProofChain.hpp",
              "#include <chrono>\n#include <cstdint>",
              "#include <chrono>\n#include <cstdint>\n#include <optional>",
          )
          replace_once(
              "crypto/ProofChain.hpp",
              '''    std::vector<std::string> get_proof_path(uint64_t seq) {\n        std::lock_guard<std::mutex> lock(m_mtx);\n        std::vector<std::string> siblings;\n        if (seq >= m_links.size()) return siblings;\n        rebuild_merkle();\n        compute_sibling_path(seq, siblings);\n        return siblings;\n    }''',
              '''    std::vector<std::string> get_proof_path(uint64_t seq) {\n        std::lock_guard<std::mutex> lock(m_mtx);\n        std::vector<std::string> siblings;\n        auto idx = index_for_sequence(seq);\n        if (!idx) return siblings;\n        rebuild_merkle();\n        compute_sibling_path(*idx, siblings);\n        return siblings;\n    }''',
          )
          replace_once(
              "crypto/ProofChain.hpp",
              '''    bool export_proof_to_file(uint64_t seq) {\n        std::lock_guard<std::mutex> lock(m_mtx);\n        if (seq >= m_links.size()) return false;\n        rebuild_merkle();\n        std::vector<std::string> siblings;\n        compute_sibling_path(seq, siblings);''',
              '''    bool export_proof_to_file(uint64_t seq) {\n        std::lock_guard<std::mutex> lock(m_mtx);\n        auto idx = index_for_sequence(seq);\n        if (!idx) return false;\n        rebuild_merkle();\n        std::vector<std::string> siblings;\n        compute_sibling_path(*idx, siblings);''',
          )
          replace_once(
              "crypto/ProofChain.hpp",
              '''            << ",\\\"leaf_hash\\\":\\\"" << m_links[seq].link_hash''',
              '''            << ",\\\"leaf_hash\\\":\\\"" << m_links[*idx].link_hash''',
          )
          replace_once(
              "crypto/ProofChain.hpp",
              '''    const std::vector<ProofLink>& links() const { return m_links; }''',
              '''    std::vector<ProofLink> links() const {\n        std::lock_guard<std::mutex> lock(m_mtx);\n        return m_links;\n    }''',
          )
          replace_once(
              "crypto/ProofChain.hpp",
              '''    std::string m_merkle_root;\n\n    void rebuild_merkle() {''',
              '''    std::string m_merkle_root;\n\n    std::optional<size_t> index_for_sequence(uint64_t seq) const {\n        auto it = std::lower_bound(\n            m_links.begin(), m_links.end(), seq,\n            [](const ProofLink& link, uint64_t value) { return link.sequence < value; });\n        if (it == m_links.end() || it->sequence != seq) return std::nullopt;\n        return static_cast<size_t>(std::distance(m_links.begin(), it));\n    }\n\n    void rebuild_merkle() {''',
          )

          test_path = Path("tests/unit/test_proofchain.cpp")
          test_text = test_path.read_text()
          anchor = '''TEST_F(ProofChainTest, SHA256HexProducesExpectedLength) {'''
          if test_text.count(anchor) != 1:
              raise SystemExit("test_proofchain.cpp: insertion anchor mismatch")
          rollover_test = '''TEST_F(ProofChainTest, SequenceLookupSurvivesBoundedPruning) {\n    for (size_t i = 0; i < ProofChain::MAX_CHAIN + 2; ++i) {\n        chain->append(ProofEventType::ANOMALY_DETECTED, "NODE_A",\n                      "data" + std::to_string(i), make_sig());\n    }\n\n    ASSERT_EQ(chain->size(), ProofChain::MAX_CHAIN);\n    const auto snapshot = chain->links();\n    ASSERT_FALSE(snapshot.empty());\n    EXPECT_EQ(snapshot.front().sequence, 2u);\n    EXPECT_TRUE(chain->get_proof_path(0).empty());\n    EXPECT_FALSE(chain->get_proof_path(snapshot.front().sequence).empty());\n    EXPECT_TRUE(chain->export_proof_to_file(snapshot.front().sequence));\n}\n\n'''
          test_path.write_text(test_text.replace(anchor, rollover_test + anchor, 1))

          replace_once(
              "enforcer/MitigationEngine.cpp",
              "#include <unistd.h>\n",
              "#include <unistd.h>\n#include <sys/syscall.h>\n",
          )
          sub_once(
              "enforcer/MitigationEngine.cpp",
              r"bool MitigationEngine::terminate_process\(uint32_t pid\) \{.*?\n\}\n\n// =============================================================================\n// IP blocking",
              '''bool MitigationEngine::terminate_process(uint32_t pid) {\n    if (!validate_pid(pid)) return false;\n\n#if defined(SYS_pidfd_open) && defined(SYS_pidfd_send_signal)\n    errno = 0;\n    int pidfd = static_cast<int>(\n        syscall(SYS_pidfd_open, static_cast<pid_t>(pid), 0));\n    if (pidfd >= 0) {\n        int rc = static_cast<int>(\n            syscall(SYS_pidfd_send_signal, pidfd, SIGKILL, nullptr, 0));\n        int saved_errno = errno;\n        close(pidfd);\n\n        if (rc == 0) {\n            std::cout << "[ENFORCEMENT] SIGKILL delivered to PID " << pid\n                      << " via pidfd." << std::endl;\n            return true;\n        }\n        if (saved_errno == ESRCH) {\n            std::cout << "[ENFORCEMENT] PID " << pid\n                      << " already exited. No action needed." << std::endl;\n            return true;\n        }\n        std::cerr << "[ENFORCEMENT] pidfd SIGKILL failed for PID " << pid\n                  << ": " << strerror(saved_errno) << std::endl;\n        return false;\n    }\n\n    if (errno == ESRCH) {\n        std::cout << "[ENFORCEMENT] PID " << pid\n                  << " already exited. No action needed." << std::endl;\n        return true;\n    }\n    if (errno != ENOSYS && errno != EINVAL) {\n        std::cerr << "[ENFORCEMENT] pidfd_open failed for PID " << pid\n                  << ": " << strerror(errno) << std::endl;\n        return false;\n    }\n#endif\n\n    // Compatibility fallback for older Linux kernels without pidfd support.\n    if (kill(static_cast<pid_t>(pid), SIGKILL) == -1) {\n        if (errno == ESRCH) {\n            std::cout << "[ENFORCEMENT] PID " << pid\n                      << " already exited. No action needed." << std::endl;\n            return true;\n        }\n        std::cerr << "[ENFORCEMENT] SIGKILL failed for PID " << pid\n                  << ": " << strerror(errno) << std::endl;\n        return false;\n    }\n\n    std::cout << "[ENFORCEMENT] SIGKILL delivered to PID " << pid << "." << std::endl;\n    return true;\n}\n\n// =============================================================================\n// IP blocking''',
              flags=re.S,
          )

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile crypto/ProofChain.hpp tests/unit/test_proofchain.cpp enforcer/MitigationEngine.cpp
          git commit -m "fix: close proof-chain and PID safety gaps"
          git fetch origin fix/runtime-hardening-2026-08-19
          git rebase origin/fix/runtime-hardening-2026-08-19
          git push origin HEAD:fix/runtime-hardening-2026-08-19

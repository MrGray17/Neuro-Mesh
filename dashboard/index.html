<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src ws: wss:;">
<title>neuro-mesh</title>
<style>
/* NEURO-MESH — operator dashboard */
:root {
  --bg:     #0d1117;
  --bg-alt: #161b22;
  --bg-card: #1c2128;
  --border: #30363d;
  --border-hover: #484f58;
  --t1:     #e6edf3;
  --t2:     #8b949e;
  --t3:     #6e7681;
  --accent: #58a6ff;
  --green:  #3fb950;
  --amber:  #d29922;
  --red:    #f85149;
  --radius: 6px;
  --mono:   'SF Mono','Cascadia Code','Consolas',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--t2);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;
  font-size:13px;line-height:1.5;
  height:100vh;display:flex;flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;height:44px;min-height:44px;
  background:var(--bg-alt);border-bottom:1px solid var(--border);
  gap:12px;
}
#header .identity{display:flex;align-items:center;gap:12px}
#node-id-display{font-weight:600;font-size:14px;color:var(--t1);letter-spacing:-0.01em}
#context-label{font-size:11px;color:var(--t3);font-weight:500;text-transform:uppercase;letter-spacing:0.05em}
#viewing-indicator{font-size:11px;color:var(--amber)!important;margin-left:4px!important;letter-spacing:0!important}
#header .status-row{display:flex;align-items:center;gap:16px}
.status-badge,#mesh-status-label{display:none}
.stat-chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px}
.stat-chip .label{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:0.04em}
.stat-chip .value{color:var(--t1);font-weight:600;font-family:var(--mono);font-size:12px}
#mesh-dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
#mesh-dot.danger{background:var(--red)}
#conn-dot{width:8px;height:8px;border-radius:50%;background:var(--border);margin-left:4px}
#conn-dot.live{background:var(--green)}
#conn-label{font-size:11px;color:var(--t3)}
/* ============================================================================
   STRICT GRID LAYOUT — cannot collapse or overlap
   - Page: header (auto) + main-grid (1fr) + footer (auto), all in 100vh
   - main-grid: 3fr (left viewing area) | 1fr (right "Node Vitals" sidebar)
   - left column: nested grid with explicit row tracks
       Row 1 auto  : viewing context sub-bar
       Row 2 1fr   : Network Topology panel
       Row 3 1fr   : Entropy Spectrogram panel
       Row 4 1fr   : Event Log panel
       Row 5 auto  : footer
   - Every panel uses position:relative + 100%/100% + overflow:hidden.
     No negative margins, no transforms, no absolute positioning outside
     the panels themselves.
============================================================================ */

#main-grid{
  flex:1 1 auto; min-height:0;
  display:grid; grid-template-columns:3fr 1fr; grid-template-rows:1fr;
  gap:0; height:100%; overflow:hidden;
  background:var(--bg);
}

#center-panel{
  grid-column:1; grid-row:1;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;
  grid-template-columns:1fr;
  min-height:0; min-width:0;
  overflow:hidden; background:var(--bg);
}

#right-panel{
  grid-column:2; grid-row:1;
  display:flex; flex-direction:column; min-height:0; min-width:0;
  overflow:hidden; background:var(--bg);
  border-left:1px solid var(--border);
}

/* Row 1: context sub-bar (auto) */
#context-bar{
  grid-row:1; grid-column:1;
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 16px; min-height:32px;
  background:var(--bg-alt); border-bottom:1px solid var(--border);
  font-size:11px; color:var(--t2);
}
#context-bar .left{display:flex; align-items:center; gap:10px}
#context-bar .right{display:flex; align-items:center; gap:8px}
#viewing-context{font-family:var(--mono); font-size:12px; color:var(--t1); font-weight:600}

/* Row 2: Network Topology — dedicated bounded cell */
#mesh-panel{
  grid-row:2; grid-column:1;
  position:relative; width:100%; height:100%;
  min-height:0; min-width:0; overflow:hidden;
  background:var(--bg-alt);
  border-bottom:1px solid var(--border);
}
#mesh-panel .panel-header{height:32px; min-height:32px; padding:0 16px}

/* Row 3: Entropy Spectrogram — completely separated, no shared canvas */
#spectro-panel{
  grid-row:3; grid-column:1;
  position:relative; width:100%; height:100%;
  min-height:0; min-width:0; overflow:hidden;
  background:#0d1117;
  border-bottom:1px solid var(--border);
}
#spectro-panel .panel-header{height:32px; min-height:32px; padding:0 16px}

/* Both canvases are isolated inside their own panel cells. No overlap. */
#mesh-canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
#spectro-canvas{position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none}

/* Row 4: Event Log — bounded cell, scrollable inside */
#event-feed-container{
  grid-row:4; grid-column:1;
  display:flex; flex-direction:column; min-height:0; min-width:0;
  overflow:hidden; background:var(--bg);
}
#event-feed{flex:1 1 auto; min-height:0; overflow-y:auto; padding:4px 0}

/* Row 5: footer (auto) */
#page-footer{
  grid-row:5; grid-column:1;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; height:30px; min-height:30px;
  background:var(--bg-alt); border-top:1px solid var(--border);
  font-size:11px; color:var(--t3); gap:12px;
}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;height:36px;min-height:36px;background:var(--bg-alt);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:0.04em}
#feed-count{font-family:var(--mono);font-size:11px;color:var(--t3);font-weight:400}
#event-feed{flex:1;overflow-y:auto;padding:4px 0}
#event-feed::-webkit-scrollbar{width:6px}
#event-feed::-webkit-scrollbar-track{background:var(--bg)}
#event-feed::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* feed entries — must use kill-entry (JS creates this className) */
.kill-entry{font-size:12px;padding:3px 16px;color:var(--t2);border-left:2px solid transparent;display:flex;gap:8px;align-items:baseline;transition:background 100ms}
.kill-entry:hover{background:var(--bg-alt)}
.kill-entry:nth-child(even){background:rgba(22,27,34,0.5)}
.kill-entry:nth-child(even):hover{background:var(--bg-alt)}
.kill-entry .ts{font-family:var(--mono);font-size:10px;color:var(--t3);flex-shrink:0;width:145px}
.kill-entry .cat{font-family:var(--mono);font-size:10px;font-weight:600;flex-shrink:0;min-width:70px}
.kill-entry .hash{font-family:var(--mono);font-size:10px;color:var(--t3);flex-shrink:0}
.kill-entry .msg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* severity by category */
.kill-entry.HEARTBEAT{border-left-color:var(--green)}
.kill-entry.HEARTBEAT .cat{color:var(--green)}
.kill-entry.ENTROPY{border-left-color:var(--accent)}
.kill-entry.ENTROPY .cat{color:var(--accent)}
.kill-entry.PBFT{border-left-color:var(--amber)}
.kill-entry.PBFT .cat{color:var(--amber)}
.kill-entry.ENFORCEMENT{border-left-color:var(--red);background:rgba(248,81,73,0.06)}
.kill-entry.ENFORCEMENT .cat{color:var(--red)}
/* mitre tags */
.mitre-tag{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:600;color:var(--accent);background:rgba(88,166,255,0.1);border:1px solid rgba(88,166,255,0.2);border-radius:3px;padding:0 4px;margin-left:6px;line-height:1.6}
/* vitals section */
.vitals-section{flex:1;display:flex;flex-direction:column;overflow:hidden}
#vit-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;height:36px;min-height:36px;background:var(--bg-alt);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:0.04em}
#vitals-body{flex:1;overflow-y:auto;padding:8px}
#vitals-body::-webkit-scrollbar{width:6px}
#vitals-body::-webkit-scrollbar-track{background:var(--bg)}
#vitals-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#mesh-pill,#vitals-pill{font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid;font-weight:500}
/* node cards (JS builds these in vitals-body) */
.node-card{padding:8px 10px;margin-bottom:4px;background:var(--bg-alt);border:1px solid var(--border);border-radius:4px}
.node-card:hover{border-color:var(--border-hover)}
.node-card.warn{border-color:var(--amber)}
.node-card.crit{border-color:var(--red)}
.node-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.node-name{font-weight:600;font-size:12px;color:var(--t1)}
.node-name.self{color:var(--accent)}
.node-threat{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em}
.node-threat.ok{color:var(--t3)}
.node-threat.warn{color:var(--amber)}
.node-threat.crit{color:var(--red)}
.node-vals{display:flex;gap:14px;font-size:11px;color:var(--t3);margin-bottom:6px}
.node-vals b{color:var(--t2);font-weight:500;font-family:var(--mono);font-size:11px}
.node-bars{display:flex;flex-direction:column;gap:2px}
.node-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.node-bar-fill{height:100%;border-radius:2px;transition:width 300ms ease}
.bar-cpu{background:var(--accent)}
.bar-mem{background:var(--amber)}
/* legacy gauge styles (JS may reference) */
.gauge-container{display:flex;align-items:center;gap:6px}
.gauge-label{font-size:10px;color:var(--t3);text-transform:uppercase}
.gauge-value{font-family:var(--mono);font-size:11px;color:var(--t2)}
.vital-row{display:flex;justify-content:space-between;padding:2px 0;font-size:11px}
.vkey{color:var(--t3);text-transform:uppercase;font-size:10px}
.vval{font-family:var(--mono);color:var(--t2);font-size:11px}
/* footer */
#footer{font-size:11px;color:var(--t3)}
#footer .right{display:flex;align-items:center;gap:10px}
#tick-clock,#tick-frame{font-family:var(--mono);font-size:11px;white-space:nowrap}
/* alert overlay */
#alert-overlay{display:none;position:fixed;inset:0;z-index:200;pointer-events:none}
#alert-overlay.active{display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(248,81,73,0.08)}
.alert-text{font-size:28px;font-weight:700;color:var(--red)}
.alert-sub{font-size:13px;color:var(--t2);margin-top:4px}
.header-quorum{font-size:11px;color:var(--t2);padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:4px}
/* === RESPONSIVE BREAKPOINTS === */
@media(max-width:1100px){
  #main-grid{grid-template-columns:1fr 280px}
  .kill-entry .ts{width:120px}
}
@media(max-width:720px){
  #main-grid{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #center-panel{grid-column:1;grid-row:1}
  #right-panel{grid-column:1;grid-row:2;max-height:300px}
  #header{flex-wrap:wrap;height:auto;min-height:36px;padding:4px 8px}
  #page-footer{flex-wrap:wrap;height:auto;padding:4px 8px}
  .node-card{padding:6px 8px}
  #alert-overlay .alert-text{font-size:18px}
}
/* === LIGHT THEME === */
[data-theme="light"]{
  --bg:#ffffff;
  --bg-alt:#f6f8fa;
  --bg-card:#ffffff;
  --border:#d0d7de;
  --border-hover:#8b949e;
  --t1:#1f2328;
  --t2:#656d76;
  --t3:#8b949e;
  --accent:#0969da;
}
[data-theme="light"] .kill-entry:nth-child(even){background:rgba(208,215,222,0.2)}
[data-theme="light"] .kill-entry:nth-child(even):hover{background:rgba(208,215,222,0.4)}
#theme-toggle{background:none;border:none;cursor:pointer;color:var(--t2);font-size:13px;padding:0 4px;line-height:1;font-family:var(--system);flex-shrink:0}
#theme-toggle:hover{color:var(--t1)}
/* === EVENT FILTER === */
#filter-row{display:flex;align-items:center;gap:6px;padding:4px 16px;height:28px;min-height:28px;background:var(--bg-alt);border-bottom:1px solid var(--border);flex-shrink:0}
#filter-input{background:var(--bg);border:1px solid var(--border);color:var(--t1);padding:2px 8px;font-size:10px;font-family:var(--mono);border-radius:3px;width:140px;outline:none}
#filter-input:focus{border-color:var(--accent)}
#filter-clear{background:none;border:none;color:var(--t2);cursor:pointer;font-size:10px;display:none}
#filter-clear.visible{display:inline}
#filter-count{font-size:10px;color:var(--t3);margin-left:auto}
.kill-entry.filtered{display:none!important}
</style>

</head>
<body>

<div id="alert-overlay">
  <div class="alert-text">THREAT DETECTED</div>
  <div class="alert-sub" id="alert-detail"></div>
</div>

<div id="app">
  <div id="header">
    <div class="identity">
      <span class="id-label" id="context-label">NODE</span>
      <span id="node-id-display">--</span>
      <span id="viewing-indicator" style="display:none"></span>
    </div>
    <div class="status-row">
      <div class="stat-chip"><span class="label">PEERS</span><span class="value" id="peer-count">0</span></div>
      <div class="stat-chip"><span class="label">QUORUM</span><span class="value" id="quorum-display">--</span></div>
      <div class="stat-chip"><span class="label">PBFT</span><span class="value" id="pbft-rounds">0</span></div>
      <div id="mesh-dot"></div>
      <span id="mesh-status-label" style="display:none"></span>
      <span id="conn-label" role="status" aria-live="polite">--</span>
      <div id="conn-dot" aria-hidden="true"></div>
      <button id="theme-toggle" aria-label="Toggle theme" title="Toggle dark/light theme">◐</button>
    </div>
  </div>
  <div id="main-grid">
    <div id="center-panel">

      <!-- Row 1 auto: viewing context sub-bar -->
      <div id="context-bar">
        <div class="left">
          <span style="color:var(--t3);text-transform:uppercase;letter-spacing:0.05em">Viewing</span>
          <span id="viewing-context">--</span>
        </div>
        <div class="right">
          <span id="peer-count" style="color:var(--t2)">0 peers</span>
        </div>
      </div>

      <!-- Row 2 1fr: Network Topology (isolated cell, no overlap) -->
      <div id="mesh-panel">
        <div class="panel-header"><span>NETWORK TOPOLOGY</span><span id="mesh-pill"></span></div>
        <canvas id="mesh-canvas"></canvas>
      </div>

      <!-- Row 3 1fr: Entropy Spectrogram (completely separate cell) -->
      <div id="spectro-panel">
        <div class="panel-header"><span>ENTROPY SPECTROGRAM</span><span id="entropy-pill" style="color:var(--t3)"></span></div>
        <canvas id="spectro-canvas"></canvas>
      </div>

      <!-- Row 4 1fr: Event Log (scrollable, bounded) -->
      <div id="event-feed-container">
        <div class="panel-header"><span>EVENT LOG</span><span id="feed-count">0</span></div>
        <div id="filter-row">
          <input id="filter-input" placeholder="filter..." aria-label="Filter events by type or text" tabindex="0">
          <button id="filter-clear" aria-label="Clear filter" tabindex="0">x</button>
          <span id="filter-count"></span>
        </div>
        <div id="event-feed"></div>
      </div>

      <!-- Row 5 auto: footer (inside the left column grid) -->
      <div id="page-footer">
        <div class="right">
          <span>CLOCK <span id="tick-clock">--:--:--</span></span>
          <span>FRAME <span id="tick-frame">--</span></span>
          <span style="color:var(--t3);margin-left:4px">v9.0</span>
        </div>
      </div>

    </div>
    <div id="right-panel">
      <div class="vitals-section">
        <div id="vit-header"><span>NODES</span><div style="display:flex;gap:6px"><span id="vitals-pill"></span></div></div>
        <div id="vitals-body"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   Neuro-Mesh Console — Zero-dependency Vanilla JS
   ========================================================================== */

// ---- Constants ----
// Each node runs its own TelemetryBridge on a unique port.
// The dashboard connects to ANY node — if one goes down, it fails over to the next.
const WS_HOST = window.location.hostname;
const WS_URLS = [
  `ws://${WS_HOST}:9000`,  // ALPHA
  `ws://${WS_HOST}:9001`,  // wsbridge (Docker) / BRAVO (native)
  `ws://${WS_HOST}:9010`,  // BRAVO (Docker)
  `ws://${WS_HOST}:9020`,  // CHARLIE
  `ws://${WS_HOST}:9030`,  // DELTA
  `ws://${WS_HOST}:9040`,  // ECHO
];
let wsUrlIndex = 0;
const MAX_FEED    = 200;
const SPEC_BARS   = 64;
const ENTROPY_MAX = 1.0;
const MAX_HISTORY = 100;  // ring-buffer cap for telemetry time-series

// ---- State ----
const state = {
  nodeId: 'NODE_1',
  peers: 0,
  pbftRounds: 0,
  quorum: '--',
  meshStatus: 'INIT',
  cpuLoad: 0,
  ramMb: 0,
  entropy: 0,
  lastAlert: false,
  alertFlag: false,
  wsLive: false,
  feedCount: 0,
  frameCount: 0,
  // Mesh graph
  nodes: [],
  edges: [],
  // Spectrogram history
  specHistory: [],
  // Telemetry time-series — RING BUFFER capped at MAX_HISTORY=100.
  // .slice(-100) on every push prevents unbounded growth over long sessions.
  entropyHistory: [],   // [{t, v}, ...]  entropy over time
  cpuHistory:     [],   // [{t, v}, ...]  CPU load %
  ramHistory:     [],   // [{t, v}, ...]  RAM MB
  pbftHistory:    [],   // [{t, v, stage, target}, ...]  PBFT rounds
  // Operator context — null = follow self node; string = viewing a specific peer
  selectedNode: null,
  // Alert cooldown — tracks when entropy last spiked so the UI can auto-clear
  lastAlertTime: 0,
};

// ---- DOM refs ----
const $ = (s) => document.getElementById(s);
const dom = {
  nodeId:       $('node-id-display'),
  contextLabel: $('context-label'),
  viewIndicator:$('viewing-indicator'),
  meshDot:      $('mesh-dot'),
  meshStatus:   $('mesh-status-label'),
  peerCount:    $('peer-count'),
  pbftRounds:   $('pbft-rounds'),
  quorum:       $('quorum-display'),
  meshPill:     $('mesh-pill'),
  vitalsPill:   $('vitals-pill'),
  viewingContext: $('viewing-context'),
  vitalsBody:   $('vitals-body'),
  feedCount:    $('feed-count'),
  eventFeed:     $('event-feed'),
  tickClock:    $('tick-clock'),
  tickFrame:    $('tick-frame'),
  connDot:      $('conn-dot'),
  connLabel:    $('conn-label'),
  themeToggle:  $('theme-toggle'),
  filterInput:  $('filter-input'),
  filterClear:  $('filter-clear'),
  filterCount:  $('filter-count'),
  alertOverlay: $('alert-overlay'),
  alertDetail: $('alert-detail'),
  meshCanvas:   $('mesh-canvas'),
  spectroCanvas:$('spectro-canvas'),
};

/* ==========================================================================
   SVG ARC GAUGES
   ========================================================================== */
function buildGauges() {
  const cpuPct = Math.min(state.cpuLoad * 100, 100);
  const ramPct = Math.min((state.ramMb / 8192) * 100, 100); // 8GB scale

  // Fix 3: when the WebSocket is disconnected, state values are stale zeros.
  // Showing "0%" / "0 MB" with a zero-length arc reads as "gauge broken".
  // Render "—" instead so the user can tell the dashboard is offline.
  const offline = !state.wsLive;
  const cpuDisplay = offline ? '—' : `${cpuPct.toFixed(0)}%`;
  const ramDisplay = offline ? '—' : `${state.ramMb} MB`;
  const cpuColor = offline ? 'var(--t3)' : cpuPct > 80 ? 'var(--red)' : cpuPct > 50 ? 'var(--amber)' : 'var(--cyan)';
  const ramColor = offline ? 'var(--t3)' : ramPct > 80 ? 'var(--red)' : ramPct > 50 ? 'var(--amber)' : 'var(--cyan)';

  dom.vitalsBody.innerHTML = `
    <div class="gauge-container">
      <span class="gauge-label">CPU LOAD</span>
      <svg viewBox="0 0 100 56">${arcPath(offline ? 0 : cpuPct, cpuColor)}</svg>
      <span class="gauge-value" style="color:${cpuColor}">${cpuDisplay}</span>
    </div>
    <div class="gauge-container">
      <span class="gauge-label">MEMORY</span>
      <svg viewBox="0 0 100 56">${arcPath(offline ? 0 : ramPct, ramColor)}</svg>
      <span class="gauge-value" style="color:${ramColor}">${ramDisplay}</span>
    </div>
    <div id="vitals-extra">
      <div class="vital-row"><span class="vkey">ENTROPY</span><span class="vval" style="color:${state.entropy > 0.65 ? 'var(--red)' : state.entropy > 0.6 ? 'var(--amber)' : 'var(--cyan)'}">${state.entropy.toFixed(4)}</span></div>
      <div class="vital-row"><span class="vkey">THREAT</span><span class="vval" style="color:${state.alertFlag ? 'var(--red)' : 'var(--green)'}">${state.alertFlag ? 'CRITICAL' : 'NONE'}</span></div>
      <div class="vital-row"><span class="vkey">STATUS</span><span class="vval">${state.meshStatus}</span></div>
      <div class="vital-row"><span class="vkey">PEERS</span><span class="vval">${state.peers}</span></div>
    </div>
  `;
}

function arcPath(pct, color) {
  if (pct > 100) pct = 100;
  if (pct < 0) pct = 0;
  const startAngle = -210;
  const endAngle = 30;
  const range = endAngle - startAngle;
  const sweep = (pct / 100) * range;

  const cx = 50, cy = 44, r = 32;
  const sw = 8;

  // Background arc
  const bgStart = polar(cx, cy, r, startAngle);
  const bgEnd   = polar(cx, cy, r, endAngle);
  const largeBg = (endAngle - startAngle) > 180 ? 1 : 0;

  // Foreground arc
  const fgEndAngle = startAngle + sweep;
  const fgEnd = polar(cx, cy, r, fgEndAngle);
  const largeFg = sweep > 180 ? 1 : 0;

  return `
    <path d="M ${bgStart.x} ${bgStart.y} A ${r} ${r} 0 ${largeBg} 1 ${bgEnd.x} ${bgEnd.y}"
          fill="none" stroke="var(--border)" stroke-width="${sw}" stroke-linecap="round"/>
    <path d="M ${bgStart.x} ${bgStart.y} A ${r} ${r} 0 ${largeFg} 1 ${fgEnd.x} ${fgEnd.y}"
          fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"
          filter="url(#glow-${color.replace('var(--','').replace(')','')})"/>
  `;
}

function polar(cx, cy, r, deg) {
  const rad = (deg * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

/* ==========================================================================
   FORCE-DIRECTED MESH GRAPH
   ========================================================================== */
let meshCtx, meshW, meshH;
const meshForces = {
  centerX: 0, centerY: 0,
  repulsion: 800,
  springLen: 100,
  springK: 0.03,
  damping: 0.85,
};

function initMeshCanvas() {
  const canvas = dom.meshCanvas;
  meshCtx = canvas.getContext('2d');
  resizeMesh();

  // Click-to-select: hit-test each node and switch operator context
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const mx = (e.clientX - rect.left);
    const my = (e.clientY - rect.top);

    // Hit-test in reverse draw order (top-most first) with a generous radius
    for (let i = state.nodes.length - 1; i >= 0; i--) {
      const node = state.nodes[i];
      const r = node.isSelf ? 12 : 8;
      const hitR = r + 6; // generous hit area
      const dx = mx - node.x;
      const dy = my - node.y;
      if (dx * dx + dy * dy <= hitR * hitR) {
        switchNodeContext(node.id);
        return;
      }
    }
  });
}

function resizeMesh() {
  const canvas = dom.meshCanvas;
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  meshW = rect.width;
  meshH = rect.height;
  canvas.width = meshW * dpr;
  canvas.height = meshH * dpr;
  canvas.style.width = meshW + 'px';
  canvas.style.height = meshH + 'px';
  meshCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  meshForces.centerX = meshW / 2;
  meshForces.centerY = meshH / 2;
  if (state.nodes.length === 0) seedMeshNodes();
}

function seedMeshNodes() {
  // Self node always at center
  state.nodes = [{
    id: state.nodeId,
    x: meshForces.centerX + (Math.random() - 0.5) * 20,
    y: meshForces.centerY + (Math.random() - 0.5) * 20,
    vx: 0, vy: 0,
    isSelf: true,
    threat: false,
    entropy: 0,
    status: 'STABLE',
    flaggedAt: 0,
  }];
  state.edges = [];
}

function upsertPeerNode(peerId) {
  if (state.nodes.find(n => n.id === peerId)) return;
  // Defensive cap: a misbehaving source that broadcasts unique IDs
  // (e.g., random src_ip) would otherwise grow this array forever.
  if (state.nodes.length >= 64) return;
  // Don't add a peer that matches our own ID (rename instead)
  if (peerId === state.nodeId) return;
  const angle = Math.random() * Math.PI * 2;
  const dist = 80 + Math.random() * 60;
  state.nodes.push({
    id: peerId,
    x: meshForces.centerX + Math.cos(angle) * dist,
    y: meshForces.centerY + Math.sin(angle) * dist,
    vx: 0, vy: 0,
    isSelf: false,
    threat: false,
    entropy: 0,
    status: 'STABLE',
    flaggedAt: 0,
  });
  // Full-mesh (clique): connect new peer to every existing node
  for (const existing of state.nodes) {
    const a = existing.id, b = peerId;
    if (a === b) continue;
    if (!state.edges.find(e => (e.a === a && e.b === b) || (e.a === b && e.b === a))) {
      state.edges.push({ a, b });
    }
  }
}

let nodeIdLocked = false; // true once we've learned our real ID from a heartbeat

function renameSelfNode(newId) {
  if (newId === state.nodeId) return;
  const oldId = state.nodeId;
  state.nodeId = newId;
  dom.nodeId.textContent = newId;

  // Update the self node in the graph
  const selfNode = state.nodes.find(n => n.isSelf);
  if (selfNode) selfNode.id = newId;

  // Re-key all edges that referenced the old ID
  for (const edge of state.edges) {
    if (edge.a === oldId) edge.a = newId;
    if (edge.b === oldId) edge.b = newId;
  }
}

function markNodeThreat(nodeId) {
  if (!nodeId || nodeId === '0.0.0.0') return;
  if (!state.nodes.find(n => n.id === nodeId || n.id.toUpperCase() === nodeId.toUpperCase())) {
    upsertPeerNode(nodeId);
  }
  const node = state.nodes.find(n => n.id === nodeId || n.id.toUpperCase() === nodeId.toUpperCase());
  if (node) {
    node.threat = true;
    node.status = 'FLAGGED';
    node.flaggedAt = Date.now();
  }
}

function switchNodeContext(nodeId) {
  // Deselect: clicking the already-selected node returns to self view
  if (state.selectedNode === nodeId) {
    state.selectedNode = null;
    dom.contextLabel.textContent = 'Node';
    dom.nodeId.textContent = state.nodeId;
    dom.viewIndicator.style.display = 'none';
    if (dom.viewingContext) dom.viewingContext.textContent = state.nodeId;
    pushFeed('HEARTBEAT', `Context reset — following local node ${state.nodeId}`, '');
    return;
  }

  state.selectedNode = nodeId;

  // Self node vs remote peer — different header treatment
  if (nodeId === state.nodeId) {
    dom.contextLabel.textContent = 'Node';
    dom.nodeId.textContent = state.nodeId;
    dom.viewIndicator.style.display = 'none';
    if (dom.viewingContext) dom.viewingContext.textContent = state.nodeId;
    pushFeed('HEARTBEAT', `Context locked — monitoring local node ${nodeId}`, '');
  } else {
    dom.contextLabel.textContent = 'Viewing';
    dom.nodeId.textContent = nodeId;
    dom.viewIndicator.textContent = '[REMOTE]';
    dom.viewIndicator.style.display = 'inline';
    if (dom.viewingContext) dom.viewingContext.textContent = nodeId;
    pushFeed('HEARTBEAT', `Context switched — now viewing ${nodeId}`, '');
  }

  // Reset spectrogram and vitals for the new context
  state.specHistory = [];
  state.cpuLoad = 0;
  state.ramMb = 0;
  state.entropy = 0;
  state.alertFlag = false;
  dom.vitalsPill.textContent = 'STABLE';
  dom.vitalsPill.style.color = 'var(--green)';
  dom.vitalsPill.style.borderColor = 'var(--cyan-dim)';
  buildGauges();
}

function matchesSelectedNode(data) {
  const target = state.selectedNode || state.nodeId;
  if (!target) return true;
  const selected = target.toUpperCase();
  const incoming = (data.node || data.ID || data.node_id || '').toUpperCase();
  return incoming === selected;
}

function stepMeshForces() {
  const nodes = state.nodes;
  const cx = meshForces.centerX;
  const cy = meshForces.centerY;
  const rep = meshForces.repulsion;
  const springLen = meshForces.springLen;
  const springK = meshForces.springK;
  const damp = meshForces.damping;

  // Repulsion between all node pairs
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[j].x - nodes[i].x;
      const dy = nodes[j].y - nodes[i].y;
      const dist = Math.max(Math.sqrt(dx * dx + dy * dy), 10);
      const force = rep / (dist * dist);
      const fx = (dx / dist) * force;
      const fy = (dy / dist) * force;
      nodes[i].vx -= fx;
      nodes[i].vy -= fy;
      nodes[j].vx += fx;
      nodes[j].vy += fy;
    }
  }

  // Spring attraction along edges
  for (const edge of state.edges) {
    const a = nodes.find(n => n.id === edge.a);
    const b = nodes.find(n => n.id === edge.b);
    if (!a || !b) continue;
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist === 0) continue;
    const force = springK * (dist - springLen);
    const fx = (dx / dist) * force;
    const fy = (dy / dist) * force;
    a.vx += fx;
    a.vy += fy;
    b.vx -= fx;
    b.vy -= fy;
  }

  // Center gravity for non-self nodes
  for (const node of nodes) {
    if (node.isSelf) {
      // Pull self toward center
      node.vx += (cx - node.x) * 0.01;
      node.vy += (cy - node.y) * 0.01;
    }
    node.vx *= damp;
    node.vy *= damp;
    node.x += node.vx;
    node.y += node.vy;
    // Clamp
    node.x = Math.max(20, Math.min(meshW - 20, node.x));
    node.y = Math.max(20, Math.min(meshH - 20, node.y));
  }
}

function drawMeshGraph() {
  const ctx = meshCtx;
  if (!ctx || meshW === 0) return;

  ctx.clearRect(0, 0, meshW, meshH);

  // Grid lines
  ctx.strokeStyle = 'rgba(0,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < meshW; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, meshH); ctx.stroke();
  }
  for (let y = 0; y < meshH; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(meshW, y); ctx.stroke();
  }

  // Edges
  for (const edge of state.edges) {
    const a = state.nodes.find(n => n.id === edge.a);
    const b = state.nodes.find(n => n.id === edge.b);
    if (!a || !b) continue;
    ctx.strokeStyle = 'rgba(0,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  // Nodes — real-time threat visualization
  const now = Date.now();
  for (const node of state.nodes) {
    const r = node.isSelf ? 12 : 8;
    const isCompromised = node.threat ||
                          node.status === 'FLAGGED' ||
                          node.status === 'SELF_ISOLATED' ||
                          node.entropy > 0.65;

    // Pulsating glow for compromised nodes — shadowBlur oscillates 8–20px at ~3 Hz
    let glowAlpha, glowRadius, coreColor, strokeColor, labelColor;
    if (isCompromised) {
      const pulse = 0.5 + 0.5 * Math.sin(now * 0.018);
      glowAlpha  = 0.4 + pulse * 0.45;          // 0.40–0.85
      glowRadius = r * (2.5 + pulse * 1.8);     // 2.5r–4.3r
      coreColor  = '#ff0040';
      strokeColor = `rgba(255,0,64,${0.8 + pulse * 0.2})`;
      labelColor = '#ff4060';
    } else {
      glowAlpha  = 0.2;
      glowRadius = r * 3;
      coreColor  = node.isSelf ? '#00ffff' : '#004444';
      strokeColor = node.isSelf ? '#00ffff' : '#008888';
      labelColor = node.isSelf ? '#00ffff' : '#aaaaaa';
    }

    const glowColor = isCompromised
      ? `rgba(255,0,64,${glowAlpha})`
      : 'rgba(0,255,255,0.2)';
    const glow = ctx.createRadialGradient(node.x, node.y, r * 0.5, node.x, node.y, glowRadius);
    glow.addColorStop(0, glowColor);
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(node.x, node.y, glowRadius, 0, Math.PI * 2); ctx.fill();

    // Core
    ctx.fillStyle = coreColor;
    ctx.beginPath(); ctx.arc(node.x, node.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = isCompromised ? 2 : 1.5;
    ctx.stroke();

    // Threat ring — extra pulsating outline for compromised nodes
    if (isCompromised) {
      const ringPulse = 0.4 + 0.6 * Math.sin(now * 0.025);
      ctx.strokeStyle = `rgba(255,0,64,${0.3 + ringPulse * 0.4})`;
      ctx.lineWidth = 2.5 + ringPulse * 2;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.arc(node.x, node.y, r + 6 + ringPulse * 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Label
    ctx.fillStyle = labelColor;
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(node.id, node.x, node.y - r - 10);

    // Selection ring — amber pulse on the operator-selected node
    if (state.selectedNode && node.id === state.selectedNode) {
      const selPulse = 0.5 + 0.5 * Math.sin(now * 0.005);
      ctx.strokeStyle = `rgba(255,176,0,${0.5 + selPulse * 0.5})`;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([4, 2]);
      ctx.beginPath();
      ctx.arc(node.x, node.y, r + 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Crosshair on center
  ctx.strokeStyle = 'rgba(0,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);
  ctx.beginPath();
  ctx.moveTo(meshForces.centerX, 0);
  ctx.lineTo(meshForces.centerX, meshH);
  ctx.moveTo(0, meshForces.centerY);
  ctx.lineTo(meshW, meshForces.centerY);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ==========================================================================
   ENTROPY SPECTROGRAM (Waterfall)
   ========================================================================== */
let specCtx, specW, specH;

function initSpectroCanvas() {
  const canvas = dom.spectroCanvas;
  specCtx = canvas.getContext('2d');
  resizeSpectro();
}

function resizeSpectro() {
  const canvas = dom.spectroCanvas;
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  specW = rect.width;
  specH = rect.height;
  canvas.width = specW * dpr;
  canvas.height = specH * dpr;
  canvas.style.width = specW + 'px';
  canvas.style.height = specH + 'px';
  specCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function pushSpectrogram(value) {
  // Power-law scaling: low values (0.001 idle) become ~0.13, spikes stay near 1.0.
  // Scaling is used ONLY for bar height/visibility — colors use the raw value.
  const scaled = Math.pow(value, 0.3);
  const bars = [];
  for (let i = 0; i < SPEC_BARS; i++) {
    const noise = (Math.sin(i * 0.3 + Date.now() * 0.001) * 0.15);
    const base = scaled * (0.3 + 0.7 * (1 - Math.abs(i - SPEC_BARS/2) / (SPEC_BARS/2)));
    bars.push(Math.max(0, Math.min(1, base + noise)));
  }
  state.specHistory.push({bars, raw: value});
  // Cap history
  const maxRows = Math.floor(specH / 3.5) || 60;
  while (state.specHistory.length > maxRows) state.specHistory.shift();
  // Mirror raw value into the 100-point ring buffer for trend rendering
  pushHistoryPoint(state.entropyHistory, value);
}

/* ============================================================================
   RING BUFFER — enforces a hard ceiling on every telemetry time-series.
   .slice(-MAX_HISTORY) keeps only the most recent N points and drops the rest
   in O(1) amortized. This is the single most important memory-leak guard
   for a long-lived dashboard session.
============================================================================ */
function pushHistoryPoint(arr, v) {
  arr.push({ t: Date.now(), v });
  if (arr.length > MAX_HISTORY) arr.splice(0, arr.length - MAX_HISTORY);
}

function drawSpectrogram() {
  const ctx = specCtx;
  if (!ctx || specW === 0) return;

  ctx.clearRect(0, 0, specW, specH);

  const barW = specW / SPEC_BARS;
  const barH = 3;
  const gap = 0.5;
  const rows = state.specHistory.length;

  for (let row = 0; row < rows; row++) {
    const entry = state.specHistory[rows - 1 - row]; // newest at bottom
    const {bars, raw} = (typeof entry === 'object' && entry.bars) ? entry : {bars: entry, raw: 0.5};
    const y = specH - (row + 1) * (barH + gap);

    for (let i = 0; i < SPEC_BARS; i++) {
      const val = bars[i];
      // Color banding uses RAW entropy (before power-law scaling).
      // Scaled val still drives alpha for brightness/visibility at low levels.
      let color;
      if (raw > 0.65)       color = `rgba(255,0,64,${0.4 + val * 0.6})`;
      else if (raw > 0.5)   color = `rgba(255,176,0,${0.3 + val * 0.5})`;
      else                  color = `rgba(0,255,255,${0.3 + val * 0.55})`;

      ctx.fillStyle = color;
      ctx.fillRect(i * barW, y, barW - gap, barH);
    }
  }

  // Threshold line
  const threshY = specH * (1 - 0.65);
  ctx.strokeStyle = 'rgba(255,0,64,0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(0, threshY);
  ctx.lineTo(specW, threshY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Label
  ctx.fillStyle = 'rgba(255,0,64,0.5)';
  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.textAlign = 'right';
  ctx.fillText('THRESH 0.65', specW - 4, threshY - 4);
}

/* ==========================================================================
   Event Feed
   ========================================================================== */
function pushFeed(category, message, hash, mitreTags) {
  state.feedCount++;
  const now = new Date();
  const ts = now.toISOString().replace('T', ' ').slice(0, 19);
  const shortHash = hash ? hash.slice(0, 12) : '--';

  let mitreHtml = '';
  if (Array.isArray(mitreTags) && mitreTags.length > 0) {
    mitreHtml = mitreTags.map(t => `<span class="mitre-tag">${escapeHtml(t)}</span>`).join('');
  }

  const entry = document.createElement('div');
  entry.className = `kill-entry ${category}`;
  entry.innerHTML = `
    <span class="ts">${ts}</span>
    <span class="cat">[${category}]</span>
    <span class="hash">${escapeHtml(shortHash)}</span>
    <span class="msg">${escapeHtml(message)}${mitreHtml}</span>
  `;

  dom.eventFeed.prepend(entry);
  dom.feedCount.textContent = `${state.feedCount} EVENTS`;

  // Prune
  while (dom.eventFeed.children.length > MAX_FEED) {
    dom.eventFeed.removeChild(dom.eventFeed.lastChild);
  }
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function getMitreTags(data) {
  if (Array.isArray(data.mitre_attack)) return data.mitre_attack;
  return [];
}

/* ==========================================================================
   ALERT
   ========================================================================== */
function triggerAlert(detail) {
  dom.alertDetail.textContent = detail || 'Mitigation Active';
  dom.alertOverlay.classList.add('active');
  setTimeout(() => dom.alertOverlay.classList.remove('active'), 500);
}

/* ==========================================================================
   WEBSOCKET CLIENT
   ========================================================================== */
let ws = null;
let wsReconnectTimer = null;
let wsReconnectMs = 1000;

function wsConnect() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

  const url = WS_URLS[wsUrlIndex];
  try { ws = new WebSocket(url); } catch (e) {
    scheduleReconnect();
    return;
  }

  ws.onopen = () => {
    state.wsLive = true;
    wsReconnectMs = 1000;
    dom.connDot.classList.add('live');
    dom.connLabel.textContent = 'WS: LIVE (' + url.split(':').pop() + ')';
    // Subscribe to telemetry topic
    try { ws.send(JSON.stringify({ action: 'subscribe', topic: 'telemetry' })); } catch(e) {}
    pushFeed('HEARTBEAT', 'WebSocket connected — telemetry stream active', '');
  };

  ws.onmessage = (ev) => {
    try {
      const data = JSON.parse(ev.data);
      routeMessage(data);
    } catch (e) {
      // Non-JSON message, ignore
    }
  };

  ws.onclose = () => {
    state.wsLive = false;
    dom.connDot.classList.remove('live');
    // Try next node on disconnect (failover)
    wsUrlIndex = (wsUrlIndex + 1) % WS_URLS.length;
    dom.connLabel.textContent = 'WS: RECONNECTING';
    scheduleReconnect();
  };

  ws.onerror = () => {
    // onclose will fire after this
    state.wsLive = false;
  };
}

function scheduleReconnect() {
  if (wsReconnectTimer) return;
  dom.connDot.classList.remove('live');
  dom.connLabel.textContent = `WS: RETRY ${(wsReconnectMs / 1000).toFixed(0)}s`;
  wsReconnectTimer = setTimeout(() => {
    wsReconnectTimer = null;
    wsReconnectMs = Math.min(wsReconnectMs * 2, 30000);
    wsConnect();
  }, wsReconnectMs);
}

/* ==========================================================================
   MESSAGE ROUTER
   ========================================================================== */
function routeMessage(data) {
  const event = data.event || data.type || '';

  switch (event) {
    case 'entropy_spike':
    case 'ebpf_entropy':
      if (matchesSelectedNode(data)) {
        state.entropy = parseFloat(data.value) || 0;
        if (state.entropy > 0.65) {
          state.alertFlag = true;
          state.lastAlertTime = Date.now();
          dom.meshDot.classList.add('danger');
        }
        pushSpectrogram(state.entropy);
      }
      pushFeed('ENTROPY',
        `eBPF entropy spike: ${parseFloat(data.value || 0).toFixed(3)} (threshold: ${data.threshold || 0.65})`,
        data.hash || '', getMitreTags(data));
      break;

    case 'lateral_movement':
      state.alertFlag = true;
      dom.meshDot.classList.add('danger');
      const srcIp = data.src_ip || '0.0.0.0';
      pushFeed('ENFORCEMENT',
        `Lateral movement detected — src: ${srcIp} pid: ${data.pid || '?'} comm: ${data.comm || '?'}`,
        data.hash || '', getMitreTags(data));
      triggerAlert(`LATERAL MOVE: ${srcIp}`);
      // Mark source IP as threat node
      markNodeThreat(srcIp);
      break;

    case 'privilege_escalation':
      state.alertFlag = true;
      dom.meshDot.classList.add('danger');
      pushFeed('ENFORCEMENT',
        `Privilege escalation — uid:${data.uid || '?'} comm: ${data.comm || '?'} parent: ${data.parent_comm || '?'}`,
        data.hash || '', getMitreTags(data));
      triggerAlert(`PRIVESC: ${data.comm || 'UNKNOWN'}`);
      break;

    case 'pbft_round_complete':
      state.pbftRounds++;
      dom.pbftRounds.textContent = state.pbftRounds;
      const stage = data.stage || '';
      const target = data.target || '';
      // Ring buffer: cap the PBFT round history to 100 entries
      pushHistoryPoint(state.pbftHistory, { stage, target, quorum: data.quorum });
      if (stage === 'EXECUTED') {
        pushFeed('PBFT',
          `Consensus EXECUTED — target: ${target} quorum: ${data.quorum || '?'}`,
          data.hash || '', getMitreTags(data));
        triggerAlert(`PBFT EXECUTED: ${target}`);
        markNodeThreat(target);
      } else {
        pushFeed('PBFT',
          `PBFT ${stage} — target: ${target} quorum: ${data.quorum || '?'}`,
          data.hash || '', getMitreTags(data));
      }
      // Update quorum display
      if (data.quorum) {
        state.quorum = String(data.quorum);
        dom.quorum.textContent = state.quorum;
      }
      break;

    case 'heartbeat':
    case 'telemetry':
      // Vitals & spectrogram — only update for the selected node context
      if (matchesSelectedNode(data)) {
        state.cpuLoad = parseFloat(data.cpu) || state.cpuLoad;
        state.ramMb   = parseInt(data.mem_mb) || parseInt(data.RAM_MB) || state.ramMb;
        // Ring buffer: every telemetry point is appended then capped to MAX_HISTORY.
        // This is the leak guard — no historical array in state can exceed 100 entries.
        pushHistoryPoint(state.cpuHistory, state.cpuLoad);
        pushHistoryPoint(state.ramHistory, state.ramMb);
        if (data.entropy !== undefined) {
          state.entropy = parseFloat(data.entropy) || 0;
          pushSpectrogram(state.entropy);
        }
        // Alert triggers
        if (data.threat === 'CRITICAL') {
          state.alertFlag = true;
          state.lastAlertTime = Date.now();
          dom.meshDot.classList.add('danger');
        }
        if (data.status === 'SELF_ISOLATED' || data.KERNEL_ANOMALY === 'TRUE') {
          state.alertFlag = true;
          state.lastAlertTime = Date.now();
          dom.meshDot.classList.add('danger');
        }
        // Cooldown: clear alert when entropy stays low for 10s
        if (state.alertFlag && state.entropy < 0.2 &&
            data.threat !== 'CRITICAL' && data.status !== 'SELF_ISOLATED' &&
            data.KERNEL_ANOMALY !== 'TRUE') {
          if (Date.now() - state.lastAlertTime > 10000) {
            state.alertFlag = false;
            dom.meshDot.classList.remove('danger');
          }
        }
      }

      // Global alert — triggers for ANY node's threat, not just the selected one
      if (data.threat === 'CRITICAL' || data.status === 'FLAGGED' ||
          data.KERNEL_ANOMALY === 'TRUE' || parseFloat(data.entropy || 0) > 0.65) {
        state.alertFlag = true;
        state.lastAlertTime = Date.now();
        dom.meshDot.classList.add('danger');
      }
      // Cooldown for global alert — clear if all nodes are nominal (checked in renderLoop)

      // Global mesh topology — always updated regardless of selected node
      if (data.peers !== undefined) {
        state.peers = parseInt(data.peers);
        dom.peerCount.textContent = state.peers;
      }
      if (data.node && !nodeIdLocked) {
        renameSelfNode(data.node);
        nodeIdLocked = true;
      }
      if (Array.isArray(data.peer_list)) {
        for (const pid of data.peer_list) {
          if (pid !== state.nodeId) upsertPeerNode(pid);
        }
      }
      if (data.node_id && data.node_id !== state.nodeId) upsertPeerNode(data.node_id);
      // Sync per-node threat state into topology canvas — maps every heartbeat to its node
      {
        const nid = (data.node || data.ID || '').toUpperCase();
        const tn = state.nodes.find(n => n.id.toUpperCase() === nid);
        if (tn) {
          const wasThreat = tn.threat;
          if (data.entropy !== undefined) tn.entropy = parseFloat(data.entropy) || 0;
          if (data.status)               tn.status = data.status;
          // Preserve explicit flagging from PBFT/enforcement — don't let
          // heartbeat data.threat="NONE" overwrite a FLAGGED node.
          const flagged = (tn.status === 'FLAGGED' || tn.status === 'SELF_ISOLATED');
          if (flagged) {
            tn.threat = true;
            // Start cooldown on first heartbeat that confirms the flag
            if (!tn.flaggedAt) tn.flaggedAt = Date.now();
            // Auto-clear after 12s
            if (Date.now() - tn.flaggedAt > 12000) {
              tn.threat = false;
              tn.status = 'STABLE';
              tn.flaggedAt = 0;
            }
          } else {
            tn.threat = (data.threat === 'CRITICAL' ||
                         data.status === 'FLAGGED' ||
                         data.status === 'SELF_ISOLATED' ||
                         data.KERNEL_ANOMALY === 'TRUE' ||
                         tn.entropy > 0.65);
          }
          // Clear threat if entropy has subsided and status is nominal
          if (!flagged && tn.entropy < 0.2 && tn.status === 'STABLE' &&
              data.threat !== 'CRITICAL' && data.KERNEL_ANOMALY !== 'TRUE') {
            tn.threat = false;
          }
        }
      }
      break;

    case 'discovery':
    case 'peer_join':
      if (data.node_id) upsertPeerNode(data.node_id);
      if (data.peer_count !== undefined) {
        state.peers = parseInt(data.peer_count);
        dom.peerCount.textContent = state.peers;
      }
      pushFeed('HEARTBEAT', `Peer joined mesh: ${data.node_id || 'unknown'}`, '');
      break;

    case 'enforcement':
      state.alertFlag = true;
      dom.meshDot.classList.add('danger');
      pushFeed('ENFORCEMENT',
        `${data.action || 'MITIGATION'} — ${data.detail || 'enforcement executed'}`,
        data.consensus_hash || '', getMitreTags(data));
      triggerAlert(data.detail || 'ENFORCEMENT EXECUTED');
      if (data.target) markNodeThreat(data.target);
      break;

    default:
      // Generic telemetry — try to extract useful fields
      if (data.ID || data.node_id) {
        const nid = data.ID || data.node_id;
        if (nid !== state.nodeId) upsertPeerNode(nid);
      }
      // Vitals only update for the selected node context
      if (matchesSelectedNode(data)) {
        if (data.CPU_LOAD !== undefined) state.cpuLoad = parseFloat(data.CPU_LOAD);
        if (data.RAM_MB !== undefined) state.ramMb = parseInt(data.RAM_MB);
        if (data.KERNEL_ANOMALY === 'TRUE') {
          state.alertFlag = true;
          dom.meshDot.classList.add('danger');
        }
        if (data.STATUS === 'SELF_ISOLATED') {
          state.meshStatus = 'ISOLATED';
          dom.meshDot.classList.add('danger');
        }
      }
      break;
  }

  // Update node display from heartbeat data (only before first heartbeat lock-in)
  if (!nodeIdLocked) {
    if (data.ID && data.ID !== state.nodeId) renameSelfNode(data.ID);
    if (data.node && data.node !== state.nodeId) renameSelfNode(data.node);
  }

  // Global alert cooldown — clear only when ALL topology nodes are nominal
  if (state.alertFlag) {
    const anyThreat = state.nodes.some(n => n.threat);
    if (!anyThreat && Date.now() - state.lastAlertTime > 10000) {
      state.alertFlag = false;
      dom.meshDot.classList.remove('danger');
    }
  }

  // Update mesh status
  if (state.alertFlag) {
    state.meshStatus = 'Alert Active';
    dom.meshStatus.textContent = state.meshStatus;
  } else if (state.peers > 0) {
    state.meshStatus = 'MESH OPERATIONAL';
    dom.meshStatus.textContent = state.meshStatus;
  } else {
    state.meshStatus = 'STANDALONE';
    dom.meshStatus.textContent = state.meshStatus;
  }

  // Update peer count
  state.peers = Math.max(state.peers, state.nodes.length - 1);
  dom.peerCount.textContent = state.peers;
  dom.meshPill.textContent = `TOPO: ${state.nodes.length} NODES`;

  // Vitals pill
  dom.vitalsPill.textContent = state.alertFlag ? 'ALERT' : 'STABLE';
  dom.vitalsPill.style.color = state.alertFlag ? 'var(--red)' : 'var(--green)';
  dom.vitalsPill.style.borderColor = state.alertFlag ? 'var(--red-dim)' : 'var(--cyan-dim)';
}

/* ==========================================================================
   RENDER LOOP
   ========================================================================== */
let animFrame;
let lastVitalsUpdate = 0;

function renderLoop(ts) {
  state.frameCount++;

  // Step mesh physics (only if nodes > 1 for performance)
  if (state.nodes.length > 1) stepMeshForces();
  drawMeshGraph();
  drawSpectrogram();

  // Update vitals every 500ms (SVG rebuild is expensive)
  if (ts - lastVitalsUpdate > 500) {
    buildGauges();
    lastVitalsUpdate = ts;
  }

  // Tick bar
  dom.tickClock.textContent = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' Z';
  dom.tickFrame.textContent = `FRAME: ${state.frameCount}`;

  // Mesh status dot
  dom.meshDot.className = 'status-dot' +
    (state.alertFlag ? ' danger' : state.wsLive ? '' : ' warn');

  animFrame = requestAnimationFrame(renderLoop);
}

/* ==========================================================================
   RESIZE HANDLER
   ========================================================================== */
function onResize() {
  resizeMesh();
  resizeSpectro();
}

/* ==========================================================================
   SIMULATION FALLBACK (when WebSocket not connected, generate mock data)
   ========================================================================== */
let simInterval = null;

function startSimulation() {
  if (simInterval) return;
  const simPeers = ['ALPHA', 'BRAVO', 'CHARLIE', 'DELTA', 'ECHO'];
  let simSeq = 0;
  let peerIdx = 0;

  simInterval = setInterval(() => {
    if (state.wsLive) {
      clearInterval(simInterval);
      simInterval = null;
      dom.connLabel.textContent = 'WS: LIVE';
      return;
    }
    dom.connLabel.textContent = 'SIMULATION';

    const seq = simSeq++;
    const eventType = seq % 6;

    switch (eventType) {
      case 0: { // entropy spike (keeps spectrogram active)
        const e = 0.45 + Math.random() * 0.5;
        routeMessage({
          event: 'ebpf_entropy',
          sensor: 'ebpf_entropy',
          value: e,
          threshold: 0.65,
          verdict: e > 0.65 ? 'ANOMALY' : 'NOMINAL',
          mitre_attack: e > 0.65 ? ['T1571'] : [],
          node: simPeers[Math.floor(Math.random() * simPeers.length)],
        });
      } break;
      case 1: { // heartbeat with full fields — populates topology + vitals + feed
        const peer = simPeers[peerIdx % simPeers.length];
        peerIdx++;
        const otherPeers = simPeers.filter(p => p !== peer);
        routeMessage({
          event: 'heartbeat',
          node: peer,
          ID: peer,
          cpu: 0.05 + Math.random() * 0.15,
          mem_mb: 40 + Math.floor(Math.random() * 60),
          peers: 4,
          entropy: 0.01 + Math.random() * 0.08,
          threat: 'NOMINAL',
          status: 'STABLE',
          KERNEL_ANOMALY: 'FALSE',
          mitre_attack: [],
          peer_list: otherPeers,
        });
      } break;
      case 2: { // lateral movement
        routeMessage({
          event: 'lateral_movement',
          src_ip: '10.99.99.99',
          pid: 4200 + Math.floor(Math.random() * 100),
          comm: 'sshd',
          verdict: 'ALERT',
          mitre_attack: ['T1021', 'T1571'],
        });
      } break;
      case 3: { // compromised node heartbeat — triggers red topology + feed entries
        const target = simPeers[Math.floor(Math.random() * simPeers.length)];
        const otherPeers = simPeers.filter(p => p !== target);
        const hiEntropy = 0.72 + Math.random() * 0.2;
        routeMessage({
          event: 'heartbeat',
          node: target,
          ID: target,
          cpu: 0.7 + Math.random() * 0.3,
          mem_mb: 120 + Math.floor(Math.random() * 180),
          peers: 4,
          entropy: hiEntropy,
          threat: 'CRITICAL',
          status: 'FLAGGED',
          KERNEL_ANOMALY: 'TRUE',
          mitre_attack: ['T1021', 'T1571', 'T1059'],
          peer_list: otherPeers,
        });
      } break;
      case 4: { // privilege escalation
        routeMessage({
          event: 'privilege_escalation',
          uid: 0,
          comm: 'bash',
          parent_comm: 'nginx',
          verdict: 'CRITICAL',
          mitre_attack: ['T1059'],
        });
      } break;

      case 5: { // PBFT round
        routeMessage({
          event: 'pbft_round_complete',
          target: simPeers[Math.floor(Math.random() * simPeers.length)],
          quorum: 4,
          stage: 'EXECUTED',
          mitre_attack: ['T1059', 'T1021', 'T1571', 'T1090'],
        });
      } break;
    }
  }, 1500);
}

/* ==========================================================================
   THEME TOGGLE
   ========================================================================== */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  dom.themeToggle.textContent = theme === 'light' ? '◑' : '◐';
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('neuro-theme', next); } catch(e) {}
}
(function loadTheme() {
  try {
    const saved = localStorage.getItem('neuro-theme');
    if (saved) applyTheme(saved);
  } catch(e) {}
})();
/* ==========================================================================
   EVENT FILTER
   ========================================================================== */
const filterState = { text: '' };
function applyFilter() {
  const txt = filterState.text.toLowerCase();
  let visible = 0, total = 0;
  dom.eventFeed.querySelectorAll('.kill-entry').forEach(el => {
    total++;
    if (!txt || el.textContent.toLowerCase().includes(txt)) {
      el.classList.remove('filtered');
      visible++;
    } else {
      el.classList.add('filtered');
    }
  });
  dom.filterClear.classList.toggle('visible', txt.length > 0);
  if (dom.filterCount) dom.filterCount.textContent = txt ? `${visible}/${total}` : '';
}
/* ==========================================================================
   KEYBOARD SHORTCUTS
   ========================================================================== */
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return; // don't steal from filter input
  switch(e.key) {
    case 't': case 'T': toggleTheme(); break;
    case 'f': case 'F': dom.filterInput.focus(); dom.filterInput.select(); e.preventDefault(); break;
    case 'Escape': filterState.text = ''; dom.filterInput.value = ''; applyFilter(); break;
  }
});
/* ==========================================================================
   INIT
   ========================================================================== */
function init() {
  initMeshCanvas();
  initSpectroCanvas();
  buildGauges();
  if (dom.viewingContext) dom.viewingContext.textContent = state.nodeId;
  pushFeed('HEARTBEAT', 'Neuro-Mesh Console ready', '');

  window.addEventListener('resize', onResize);

  // Theme toggle
  dom.themeToggle.addEventListener('click', toggleTheme);

  // Event filter
  dom.filterInput.addEventListener('input', () => {
    filterState.text = dom.filterInput.value;
    applyFilter();
  });
  dom.filterClear.addEventListener('click', () => {
    dom.filterInput.value = '';
    filterState.text = '';
    applyFilter();
    dom.filterInput.focus();
  });

  // Start WebSocket connection
  wsConnect();

  // Start simulation fallback (runs until WS connects)
  startSimulation();

  // Start render loop
  animFrame = requestAnimationFrame(renderLoop);

  // Pause render loop when tab is hidden to avoid burning CPU/memory
  // on backgrounded tabs. The rAF callback is naturally throttled to
  // ~1Hz when hidden, but explicit cancellation is cleaner and prevents
  // buildup of queued rAF work over long sessions.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (animFrame) { cancelAnimationFrame(animFrame); animFrame = 0; }
    } else if (!animFrame) {
      animFrame = requestAnimationFrame(renderLoop);
    }
  });

  // Cleanup on page unload — release all timers and the WebSocket
  // so they cannot hold references after navigation.
  window.addEventListener('pagehide', teardown);
  window.addEventListener('beforeunload', teardown);
}

/* Teardown: stop render loop, simulation, reconnect, WS, and clear all
   time-series arrays. Prevents detached-DOM and zombie-listener leaks. */
function teardown() {
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = 0; }
  if (simInterval)  { clearInterval(simInterval);  simInterval  = null; }
  if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
  if (alertTimeout) { clearTimeout(alertTimeout); alertTimeout = null; }
  if (ws) { try { ws.close(); } catch (e) {} ws = null; }
  state.entropyHistory.length = 0;
  state.cpuHistory.length     = 0;
  state.ramHistory.length     = 0;
  state.pbftHistory.length    = 0;
  state.specHistory.length    = 0;
}

document.addEventListener('DOMContentLoaded', init);
</script>
